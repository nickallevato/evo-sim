  Ne_histories:
    prado_martinez_2013_table1:
      source: PradoMartinez2013
      locator: "Table 1, column 'Ne (10-3)', footnote d ('Calculated from Θw. μ = 1e-9 - 0.5e-9 mut·bp-1·yr-1 and g = 25 for Homo and Pan')"
      verified: true
      humans: [1.31e4, 1.62e4]          # flagged: not a 2x range like every other row; unresolved
      non_african: [9.7e3, 1.95e4]
      african: [1.39e4, 2.79e4]
      common_chimpanzee: [3.09e4, 6.18e4]
      nigeria_cameroon_chimpanzee: [1.85e4, 3.70e4]
      eastern_chimpanzee: [1.97e4, 3.95e4]
      central_chimpanzee: [2.44e4, 4.87e4]
      western_chimpanzee: [9.8e3, 1.95e4]
      bonobo: [1.19e4, 2.38e4]
    prado_martinez_2013_psmc_text: {value: "qualitative only", note: "ancestral Pan Ne largest >3 Mya, then dramatic decline; chimpanzee Ne increase from ~1 Mya (text L197-200, L323-325)", source: PradoMartinez2013, verified: true}
    takahata_1995: {value: 1.0e4, note: "Late Pleistocene human Ne from autosomal sequences, 'no indication of population expansion'; human-lineage Ne >4.6 My ago 'nearly 10 times larger' (~1e5); divergence date 4.6 My differs from 6.3 My used here", source: "Takahata, Satta & Klein 1995, Theor Popul Biol 48:198-221, doi 10.1006/tpbi.1995.1026", verified: partial}
    charlesworth_2009: {value: [1.0e4, 2.0e4], note: "review summary of sequence-variability estimates (via search summary)", source: "Charlesworth 2009, Nat Rev Genet 10:195", verified: false}
