objects:
- id: M-001
  kind: formula
  statement: F_max = t_div * d / (g_len * G_f); shortfall = R / F_max
  variables:
  - divergence.t_div_years
  - generation_time_years
  - selection.turnover_d
  - ltee.gens_per_fixation
  - divergence.required_fixations
  used_by:
  - A
  - A4d
  - A2
  - A1
  sources:
  - B2026-02-04 para10
  - Z18441321
  - Z18452504
  positions:
    day: 'Aggregate throughput: F_max is a maximum number of fixations per lineage; G_f already includes parallelism and all mechanisms.'
    critic: 'Arithmetic is not wrong (Camestros CA-02); the dispute is the model: Hancock reads it as sequential; 3.0 drops d.'
  resolution: derivation
  status: resolved
  resolved_by: research/checks/results/R4-F2-A.md
- id: M-002
  kind: identity
  statement: 'Version arithmetic: 2019 table 125 / text 562 vs 9e6/20/1600=281.25; 2025 146,250/1,600=91.4; 3.0 252,000/1,322=190.6 and 205e6/190.6=1.075e6; Hoessjer 126.6; 252,000/1,400=180'
  variables:
  - divergence.t_div_years
  - ltee.gens_per_fixation
  used_by:
  - A
  - A2j
  - A5a
  sources:
  - A claim file 'derived' table
  positions:
    day: 2025 and 3.0 figures reproduce to rounding; 2019 text/table need an unstated doubling.
    critic: 'Camestros reviewed only the first edition; the 2019 125 vs 562 do not reconcile (candidate: 125 needs 4.0e6 y, 562 needs doubling).'
  resolution: derivation
  status: open
- id: M-003
  kind: model-choice
  statement: Does the LTEE G_f (one fixation per ~1,322 gen, asexual, one clone) transfer as a ceiling to a recombining, sexual genome with ~38.4 new mutations per generation (vs 4.1e-4 in E. coli)? Fixation
    rate vs supply, recombination and N_e
  variables:
  - mutation.new_mutations_per_haploid_genome
  - ltee.mu_genome_ancestral
  - ltee.gens_per_fixation
  used_by:
  - A
  - A2e
  - A5
  - A5f
  - A2
  - A5b
  sources:
  - Q-A-sim
  - Z23003785 s4.3
  - RE-07
  positions:
    day: G_f is a measured aggregate throughput; asexual saturation is logarithmic (a=0.23-0.34 per 100x supply) so supply does not scale it linearly; no mammal fixation observed faster than 1,600 gen.
    critic: Fixation rate scales with supply and recombination (free recombination R_int 0.97 vs clonal 0.09); LTEE is nonrecombining, one environment, so not transferable to mammals.
  resolution: simulation
  status: open
  compute:
    host: na-workhorse
    est_cpu_h: 250
    est_ram_gb: 6
    measured: false
- id: M-004
  kind: inference
  statement: 'The LTEE rate is an empirical ceiling on what evolution can do, so the human shortfall is a lower bound (conditional: per-generation adaptive-only supply-limited model, transfer factor kappa)'
  variables:
  - ltee.gens_per_fixation
  used_by:
  - A2e
  - A
  - A2d
  - A2i
  sources:
  - Z23003785 p.2
  positions:
    day: Whatever the LTEE produces is the ceiling under ideal conditions (Formula One car vs cart).
    critic: 'Non-sequitur: ceiling claim needs a transfer factor; flip kappa* is a threshold on supply x beneficial fraction x effect size.'
  resolution: derivation
  status: resolved
  resolved_by: research/checks/results/R4-A2e.md
- id: M-005
  kind: inference
  statement: 'Units: a high per-year bacterial fixation rate comes from short generation time B1, so using generations per fixation A1 as a generous bound for humans is not licensed (X = A x B)'
  variables:
  - generation_time_years
  - ltee.gens_per_fixation
  used_by:
  - A2i
  - A2e
  sources:
  - Matev comment 340270022 (RF-4)
  positions:
    day: Time, not generations, is what counts (as attributed, 2022 post not in corpus); LTEE rate generous for humans.
    critic: Per-year rate says nothing about A1 vs A2 (generations per fixation); the 2022 attribution is unretrieved.
  resolution: derivation
  status: open
