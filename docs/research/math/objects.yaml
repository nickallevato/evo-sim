  statement: 'Weasel under population genetics: per-letter fixation time (2/s) ln(2N) = 396 at s = 0.05 and 19,807 at s = 0.001 for N = 10,000, times 27 letters = 10,692 and 540,000 (Day rounds 11,000 and 540,000), against Dawkins''s 50 generations (ratio 10,800); serial letters assumed; claim-file scratch run gives conditional means 332 and 8,525 and a parallel maximum near 13,092'
