objects:
- id: M-101
  kind: inference
  statement: An observed count over a duration gives an average rate (X/Y); does that rate exist and mean something as a bound when the process is stochastic, non-Gaussian and varies across species and conditions
  used_by: [G1, G1c]
  sources:
  - evo006
  - evo007
  - evo009
  positions:
    day: The average exists by arithmetic ("It is division"); averages of fixation times are what 4N_e and (2/s)ln(2N_e s) are; variance affects the tails, not existence
    critic: 'The average exists but is uninformative without the distribution (Hancock: not Gaussian, multimodal; Maddie: wind speed; Matthews: cancer metastasis); rates depend on parameters'
  resolution: derivation
  status: open
- id: M-102
  kind: formula
  statement: 'Cross-ape average rate: 398,673,272 bp / 6.3 My = 63.281 bp/y; mean over six apes 62.7 bp/y = 1,958.81 bp per effective generation (g=25 y, d=0.80, factor 25/0.8 inferred); read as the speed natural selection, drift and relictation must have run at'
  used_by: []
  new_claim: "Cross-ape divergence gives a required evolutionary speed (~63 bp/y, ~1,959 bp per effective generation) independent of the LTEE; Day (day side)"
  sources:
  - evo006
  positions:
    day: Every input is mainstream and none comes from the LTEE; the rate is what any mechanism must reach
    critic: 'Needs the step from an average divergence rate to a required fixation rate: constant rate, all divergence fixed (not polymorphic), assignment to lineages, bp vs events (see pilot A M-021)'
  resolution: derivation
  status: open
- id: M-103
  kind: model-choice
  statement: 'Does the LTEE generations-per-fixation transfer to humans given clonal start, no recombination and no standing variation: Day says standing variation cannot cut fixation time once selection acts and recombination cannot compensate; critics say the clonal zero-polymorphism start inflates the LTEE rate and recombination speeds sweeps'
  used_by: [A2e, A2d]
  sources:
  - evo005
  - evo008
  positions:
    day: Standing variation shortens only the wait for a beneficial allele, not the fixation time; admits the LTEE is a worst case for mutation supply; cites Lynch on prokaryote efficiency
    critic: Clonal start and no recombination make the comparison apples-to-oranges (Matthews, in vid02); Day replies to a position critics say they do not hold (that humans fixate faster than bacteria)
  resolution: derivation
  status: open
- id: M-104
  kind: parameter
  statement: 'Mean selection coefficient of fixed substitutions: 0.875 x 0 + 0.125 x 0.0012 = 1.5e-4, from alpha ~ 12.5% (McDonald-Kreitman, hominids) and s+ = N_e s / N_e = 12/10,000 = 0.0012 (Tataru et al.)'
  used_by: []
  new_claim: "Mean s of human fixations is ~1.5e-4 (alpha 12.5%, s+ 0.0012), so sweeps are slower than the LTEE-derived s; Day (day side)"
  sources:
  - evo005
  positions:
    day: Empirical s for fixations is ~1.5e-4, two orders below s = 0.01
    critic: Averaging s over a neutral/adaptive mixture and putting it in the sweep formula (2/s)ln(2N_e s) is a modelling choice; the sources were not checked here
  resolution: lookup
  status: open
- id: M-105
  kind: formula
  statement: 'Fixation time under overlapping generations: dividing the discrete-model time by d = 0.80 (14,648 -> 18,310; 40,000 -> 50,000 generations); sweep time (2/s)ln(2N_e s) for s = 1.5e-4 at N_e 1e4, 1e5, 1e6 = 14,648, 45,349, 76,051'
  used_by: [A4c, F3]
  sources:
  - evo005
  - evo006
  positions:
    day: d rescales generations (time-weighted overlap correction)
    critic: Standard N_e scaling already handles overlap (Hancock, vid02); whether dividing by d is the correct correction is open (see pilot A M-025, M-027)
  resolution: derivation
  status: open
- id: M-106
  kind: formula
  statement: 'Throughput ceiling: total selection budget sum(s_i) <= s_max over concurrent sweeps, the mean s-bar cancels and the sum is n x s-bar, so the shape of the distribution of fitness effects does not matter'
  used_by: [F1, G2h]
  sources:
  - evo007
  positions:
    day: The mean is the right summary statistic for a throughput ceiling; the DFE shape drops out
    critic: 'Hancock: every mutation in the DFE has its own fixation probability and the DFE evolves; whether a fixed budget s_max exists is not derived in the post'
  resolution: derivation
  status: open
- id: M-107
  kind: model-choice
  statement: 'Is the selective turnover coefficient d coherent and needed beyond N_e scaling: WD says Wright-Fisher and Moran answer how fast drift moves neutral alleles and d answers how fast the gene pool turns over; Hancock says gene-pool turnover is not meaningful because alleles are staggered; Day says rates are averages of staggered events'
  used_by: [A4, A4e, A4f]
  sources:
  - evo008
  - evo009
  - evo010
  positions:
    day: d is defined, derived and evidenced in a chapter and an appendix; "not meaningful" would invalidate every rate; Hancock must show d incoherent or already captured
    critic: d appears in no population-genetics model; the post gives no definition of its variables; WD says d is "essentially nothing to do with" MITTENS (separability open)
  resolution: derivation
  status: open
- id: M-108
  kind: model-choice
  statement: A mutation rate that includes structural variants (76.8 per haploid genome per generation, Perubski et al.; u = 76.8/3e9 = 2.56e-8) compared with a divergence that counts only the ~35M SNV differences
  used_by: [A3b, A3x]
  sources:
  - evo008
  - evo009
  positions:
    day: A total mutation rate must be compared with the total divergence, not the SNP fraction (98.91% omitted); Griffiths was right to flag it
    critic: 'Hancock: the fixation equation does not distinguish mutation types; swapping rate mid-calculation is a Day-side point against Hancock''s whiteboard, and Hancock disputes it'
  resolution: derivation
  status: open
- id: M-109
  kind: formula
  statement: 'Expected count of neutral fixations landing in the observed divergent sites: WD scales by the 1.09% divergent fraction (76.8 x 201,600 x 35e6/3.2e9 = 169,344) against Hancock/Day: about 90% of the genome is unconstrained, which 1.09% fixes is random, so the neutral expectation applies to the whole genome'
  used_by: [A3c, B6a]
  sources:
  - evo008
  - evo009
  positions:
    day: 'Neutral prediction applies to the entire genome (WD: circular to put all of it in the divergent sites); Day in 009 says the same and charges Hancock with applying all of it to the 1.09%'
    critic: Rerun the clock and a different 1.09% fixes; the 1.09% is the recency of divergence, not the only sites that could fix
  resolution: derivation
  status: open
- id: M-110
  kind: parameter
  statement: 'Effective generations since the CHLCA: 252,000 nominal (6.3M y / 25 y) at d = 1; 252,000 x 0.80 = 201,600 effective at d = 0.80'
  used_by: [A4c, A1]
  sources:
  - evo009
  - evo008
  positions:
    day: d = 0.80 is the weighted time-average correction for overlap; critics should have used 201,600
    critic: Hancock used the number WD presented; Wright-Fisher/Moran-with-N_e already account for overlap
  resolution: derivation
  status: open
- id: M-111
  kind: identity
  statement: k = mu holds in finite time only for a static effective population equal to the census size; with overlapping generations no finite period has k = mu (arXiv 2208.00148v1); the identity has no time term so it cannot say whether fixations complete in a window
  used_by: [B2, B3]
  sources:
  - pgenetics
  - evo009
  positions:
    day: Kimura's k = mu is a steady-state identity, irrelevant to finite-window questions, and the molecular clock is circular; AI answers agree
    critic: 'k = mu is an expectation of the long-run substitution rate; the post cites an arXiv paper outside evolution journals and no derivation is given in it; Hancock: refuted by 1930s population genetics'
  resolution: derivation
  status: open
- id: M-112
  kind: model-choice
  statement: 'Neutral fixation across a species when species lifespans (1-2 My per Gemini) are shorter than 4N_e generations: transient polymorphism, rescue by bottleneck or deme replacement; Day: a bottleneck at the optimum only halves the fixation time'
  used_by: [B, B2]
  sources:
  - mailvox
  positions:
    day: Neutral drift and bottlenecks are not a retreat; the halving is "done the math" (unreleased here; Relictation paper)
    critic: No critic reply in the window; Gemini's concessions are an LLM output, not a derivation; the species-lifespan premise and what counts as one lineage are open
  resolution: derivation
  status: open
- id: M-113
  kind: formula
  statement: 'Kimura fixation probability for a new mutation as given: P(fix) = (1 - e^(-2s)) / (1 - e^(-4Ns))'
  used_by: [B7a, F4]
  sources:
  - evo007
  positions:
    day: Needs N and s; throughput question is separate
    critic: Hancock agrees inputs N and s determine P(fix) and varies with demography and DFE
  resolution: lookup
  status: open
- id: M-114
  kind: parameter
  statement: Day's parameter set in the 10-23 post (N_e ~ 33,000, s-bar ~ 0.001, g ~ 29 y, d ~ 0.45) against the 10-18..10-30 posts (N_e 10,000 in the 10-21 tables, g = 25 y, d = 0.80)
  used_by: [A4a, A4c]
  sources:
  - evo007
  positions:
    day: Stated as the human parameter set that "gets an answer"; the post gives no source for g = 29
    critic: 'Version drift inside one fortnight: which set MITTENS 3.0 and the book use is a provenance question (parameters.yaml)'
  resolution: lookup
  status: open
  variant_of: M-110
- id: M-115
  kind: inference
  statement: 'Rate vs latency: an observed generations-per-fixation average holds whether fixations are serial or overlapping (highway: 3,600 s / 360 cars = 10 s per car); does applying it to the divergence time follow'
  used_by: [F1, F1a]
  sources:
  - evo008
  positions:
    day: MITTENS is a rate calculation, not a latency calculation; anticipated in the book
    critic: 'Hancock: the arithmetic assumes each mutation arises and fixes before the next; the LTEE regime may not transfer (M-103)'
  resolution: derivation
  status: open
- id: M-116
  kind: inference
  statement: 'Classification: is MITTENS the waiting-time problem (mutation arrival) or a distinct fixation problem built on observed fixations'
  used_by: [F1, F1c]
  sources:
  - evo008
  positions:
    day: 'WD: not the waiting-time problem, "an empirical audit of observable fixations", better called the fixation problem'
    critic: 'Matthews: still a waiting-time problem, mutation rate and fixation rate used interchangeably since Axe''s early-2000s paper'
  resolution: derivation
  status: open
- id: M-117
  kind: empirical
  statement: Standard population genetics models real populations accurately (pedigree studies, fruit flies, rats, humans) and "doesn't match Vox's math"; no paper or number cited in the quoted passage
  used_by: []
  new_claim: "Standard population genetics models real populations accurately, so MITTENS contradicting it is an error in MITTENS; Matthews/Hancock (critic side)"
  sources:
  - evo008
  - evo009
  positions:
    day: Not addressed in the window; Day cites six of his own papers as the answer to why classical formulas fail (M-111)
    critic: If Day is right those papers should not exist (Matthews); no specific papers named
  resolution: data-check
  status: open
- id: M-118
  kind: empirical
  statement: Which edition of Probability Zero the critics' first video used (original ePub vs the second edition) and whether page numbers and figures differ for that reason
  used_by: []
  new_claim: "The critics' first video answered the original-edition ePub of Probability Zero, not the second edition; Day via Duffy (day side)"
  sources:
  - evo008
  positions:
    day: They obtained the original-edition ePub, not the purchasable second edition (WD, relayed by Day)
    critic: 'Matthews: the first video answered WD''s PowerPoint; they had not read the book then and did read MITTENS 3.0'
  resolution: lookup
  status: open
- id: M-119
  kind: inference
  statement: 'Molecular-clock circularity: divergence dates are derived from k = mu and then cited as independent confirmation of it (Day: the sole practical application of k = mu)'
  used_by: [B4d, C6]
  sources:
  - pgenetics
  positions:
    day: '"Both circular and logically invalid"'
    critic: Clock dates also rest on fossil calibration, not on k = mu alone; "sole practical application" is an absolute claim
  resolution: derivation
  status: open
- id: M-120
  kind: model-choice
  statement: 'Does the standard selection-visibility threshold (|s| > 1/(2N_e)) show selection becoming ever more effective as N grows, so that the models predict strong selection in modern humans (Day: N_e 10,000 -> 5e-5; 10 million -> 5e-8; N_e 80 million at N_e/N 0.01 -> ~6e-9) and fail empirically; or is the threshold a drift-versus-selection visibility criterion that says nothing about differential survival'
  used_by: [H10, A4g]
  sources:
  - evo010
  positions:
    day: Neither Wright-Fisher nor Moran has an N_e at which selection becomes impossible; d is the missing variable
    critic: 'Not addressed first-hand in the window. The ChatGPT answer Day quotes says selection is ineffective when N_e s << 1 and N_e/N sets no threshold; the post does not say whether the threshold concerns drift visibility or realised mortality (rule U: model output relayed by Day)'
  resolution: derivation
  status: open
- id: M-121
  kind: parameter
  statement: 'd declines from 0.86 (wild chimps) to 0.015 (humanity 2026) "over evolutionary time" and "the chart" shows it; consequence claimed: humanity no longer subject to selection, genome degrading. Compare d = 0.80 (M-110) and d = 0.45 (M-114)'
  used_by: [H10, A4a]
  sources:
  - evo010
  positions:
    day: 'd = 0.86 for wild chimps and 0.015 for 2026 humanity; selection has "no medium to work through" at 0.015'
    critic: 'No data, chart or derivation in the post; three different d values for humans across one fortnight (0.80, 0.45, 0.015) leave the provenance of each open (parameters.yaml); not addressed first-hand'
  resolution: lookup
  status: open
  variant_of: M-110
- id: M-122
  kind: parameter
  statement: 'In the LTEE spreadsheets "one specific gene" (title: pykF) was among the first five fixations in 9 of 12 populations, first in 5 of those 9, and second in 3 of those 5; read as a predictable order of fixation'
  used_by: [A2e]
  sources:
  - pykf
  positions:
    day: Day read the detailed spreadsheets of the twelve populations and found the repeat; it shows a constrained landscape (via Athos output)
    critic: 'Not addressed first-hand in the window. The counts are not tied to a cited table, gene list or definition of "fixation"; parallel recurrence of pykF mutations in replicate populations is a lookup against the published LTEE data (not done here)'
  resolution: lookup
  status: open
- id: M-123
  kind: inference
  statement: 'The fixation rate in the LTEE "is observably slowing down over time" and this is "missing from the literature"; inference (Athos, relayed): diminishing-returns epistasis, so LTEE shows optimisation within existing architecture and may "prove that evolution by natural selection cannot work even in the laboratory"'
  used_by: [A2e]
  new_claim: "The LTEE's falling fixation rate shows self-limiting optimisation, not open-ended evolution; Day (day side)"
  sources:
  - pykf
  positions:
    day: The rate declines, each later fixation has a smaller gain, and the literature does not say so
    critic: 'Not addressed first-hand in the window. Open: whether a declining rate of fixations is already reported in the LTEE literature, whether it follows from diminishing returns, and whether a slowdown in a fixed, finite-N flask bears on the M-110 rate comparison; no rate series or table is given'
  resolution: lookup
  status: open
- id: M-124
  kind: inference
  statement: 'pykF and spoT mutations are loss-of-function or regulatory tuning, so the most repeatable LTEE signal is "gene degradation" and the LTEE demonstrates optimising, not creative, power (Athos output, relayed by Day, no citation)'
  used_by: []
  new_claim: "Repeatable LTEE adaptations are loss-of-function or regulatory tuning, not novelty; Day relaying Claude Athos (day side)"
  sources:
  - pykf
  positions:
    day: Gene degradation is the predictable signal; this is optimisation inside a narrow niche
    critic: 'Not addressed first-hand. Open: the mutation classes for pykF and spoT are a lookup; whether loss-of-function counts as adaptive fixation (it does under the standard model) is a definition question; model output relayed by Day, rule U'
  resolution: lookup
  status: open
- id: M-125
  kind: formula
  statement: 'In humans relictation accounts for about half the base pairs natural selection does, and the two together account for under 8% of total divergence ("tens of millions of divergent base pairs" unaccounted); hitchhiking and relictation named as other routes to neutral substitution'
  used_by: [E4, F6]
  sources:
  - smokescreen
  - gene-flow
  positions:
    day: Relictation is an identified, proved and quantified mechanism; no further mechanism will close the gap
    critic: 'No inputs or derivation in either post (the Relictation paper is the source, unreleased calculation per M-112 context); the 8% depends on the M-102 required rate and on N_e, g, d choices (M-110, M-114); hitchhiking is linked sites, not an additional free count'
  resolution: derivation
  status: open
- id: M-126
  kind: model-choice
  statement: 'Gene flow is "a structural hindrance to the pace of fixation" by selection and drift: a species-wide substitution in a structured species needs migrants to carry an allele between demes, and between diverging lineages gene flow erases differences; does this bear on the rate comparison with the LTEE'
  used_by: [F]
  sources:
  - gene-flow
  positions:
    day: Gene flow adds a stage to every fixation and works against divergence, so it cannot close the accounting gap
    critic: 'Not addressed first-hand. Open: structured-population fixation times can be shorter or longer than panmictic ones depending on migration and selection regime (a derivation, not done); the post gives no transit-time formula; the LTEE is a set of isolated, unstructured flasks'
  resolution: derivation
  status: open
