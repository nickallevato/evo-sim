<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 640" width="1010" height="640" font-family="DejaVu Sans, Verdana, sans-serif" fill="#6e7681" role="img" aria-label="evo-sim audit systems diagram: sources to simulator spec, with the criticality layer over all of it"><title>evo-sim audit systems diagram: sources to simulator spec, with the criticality layer over all of it</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eab308"/></marker></defs><rect x="20" y="40" width="140" height="64" rx="8" fill="#e8833a" fill-opacity="0.16" stroke="#e8833a" stroke-width="1.5"/><text x="90" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Sources</text><text x="90" y="75.85" text-anchor="middle" font-size="10">Day · critics · literature</text><text x="90" y="89.85" text-anchor="middle" font-size="10">(book not yet read)</text><rect x="190" y="40" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="260" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Verbatim quotes</text><text x="260" y="75.85" text-anchor="middle" font-size="10">locator + date + sha256</text><text x="260" y="89.85" text-anchor="middle" font-size="10">no full texts in git</text><rect x="360" y="40" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="430" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Claims (234)</text><text x="430" y="75.85" text-anchor="middle" font-size="10">3 verdicts each:</text><text x="430" y="89.85" text-anchor="middle" font-size="10">internal · fidelity · external</text><rect x="530" y="40" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="600" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Argument tree + map</text><text x="600" y="75.85" text-anchor="middle" font-size="10">branches A-H, defeaters,</text><text x="600" y="89.85" text-anchor="middle" font-size="10">lineage, standard forms</text><rect x="700" y="40" width="140" height="64" rx="8" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-width="1.5"/><text x="770" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Synthesis (R5)</text><text x="770" y="75.85" text-anchor="middle" font-size="10">sensitivity table,</text><text x="770" y="89.85" text-anchor="middle" font-size="10">aggregation + stopping rule</text><rect x="870" y="40" width="120" height="64" rx="8" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-width="1.5"/><text x="930" y="61.85" text-anchor="middle" font-size="11" font-weight="700">Simulator spec</text><text x="930" y="75.85" text-anchor="middle" font-size="10">variable list</text><text x="930" y="89.85" text-anchor="middle" font-size="10">(next phase)</text><path d="M160,72 L190,72" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M330,72 L360,72" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M500,72 L530,72" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M670,72 L700,72" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M840,72 L870,72" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><rect x="20" y="180" width="310" height="64" rx="8" fill="#e8833a" fill-opacity="0.16" stroke="#e8833a" stroke-width="1.5"/><text x="175" y="201.85" text-anchor="middle" font-size="11" font-weight="700">Hard rules</text><text x="175" y="215.85" text-anchor="middle" font-size="10">both sides equal scrutiny · verbatim quotes only · pre-register</text><text x="175" y="229.85" text-anchor="middle" font-size="10">no outward action without owner approval</text><rect x="360" y="180" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="430" y="201.85" text-anchor="middle" font-size="11" font-weight="700">Checks</text><text x="430" y="215.85" text-anchor="middle" font-size="10">pre-register → run</text><text x="430" y="229.85" text-anchor="middle" font-size="10">→ write-up (+ post hoc)</text><rect x="530" y="180" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="600" y="201.85" text-anchor="middle" font-size="11" font-weight="700">Reviews</text><text x="600" y="215.85" text-anchor="middle" font-size="10">load-bearing: 3 reviews</text><text x="600" y="229.85" text-anchor="middle" font-size="10">low-stakes: 1 combined</text><rect x="700" y="180" width="140" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="770" y="201.85" text-anchor="middle" font-size="11" font-weight="700">Verdict rule</text><text x="770" y="215.85" text-anchor="middle" font-size="10">R1 S SC N F U C</text><text x="770" y="229.85" text-anchor="middle" font-size="10">RH (tag) · RD (readings)</text><rect x="870" y="180" width="120" height="64" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="930" y="201.85" text-anchor="middle" font-size="11" font-weight="700">Ledgers</text><text x="930" y="215.85" text-anchor="middle" font-size="10">slips · fidelity</text><text x="930" y="229.85" text-anchor="middle" font-size="10">balance · versions · gaps</text><path d="M390,104 L390,180" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M500,212 L530,212" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M670,212 L700,212" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M840,212 L870,212" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M770,180 L770,150 L470,150 L470,104" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><text x="620" y="144" text-anchor="middle" font-size="9">verdicts written back to claim files</text><path d="M930,180 L930,150 L800,150 L800,104" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M600,104 L600,128 L430,128 L430,180" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="540" y="122" text-anchor="middle" font-size="9">load-bearing list</text><rect x="10" y="292" width="990" height="338" rx="14" fill="#8b5cf6" fill-opacity="0.07" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 4"/><text x="24" y="312" text-anchor="start" font-size="12" font-weight="700" fill="#8b5cf6">CRITICALITY LAYER (standing; audits the method, not the sources)</text><path d="M440,292 L440,246" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M600,292 L600,246" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M770,292 L770,246" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M930,292 L930,246" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="990" y="312" text-anchor="end" font-size="10">tests everything above: method, independence, fairness, doc versus practice</text><rect x="24" y="322" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="140" y="342.85" text-anchor="middle" font-size="11" font-weight="700">Method audit MA-01..20</text><text x="140" y="356.85" text-anchor="middle" font-size="10">third-party style, same-model</text><text x="140" y="370.85" text-anchor="middle" font-size="10">proposals a-f held back</text><rect x="268" y="322" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="384" y="342.85" text-anchor="middle" font-size="11" font-weight="700">Triveritas critique TV-01..11</text><text x="384" y="356.85" text-anchor="middle" font-size="10">Day's own L / M / E test</text><text x="384" y="370.85" text-anchor="middle" font-size="10">applied to this audit</text><rect x="512" y="322" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="628" y="342.85" text-anchor="middle" font-size="11" font-weight="700">Pre-registration status</text><text x="628" y="356.85" text-anchor="middle" font-size="10">62 checks labelled:</text><text x="628" y="370.85" text-anchor="middle" font-size="10">blind · single-commit · unknown</text><rect x="756" y="322" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="872" y="342.85" text-anchor="middle" font-size="11" font-weight="700">Methods + limitations</text><text x="872" y="356.85" text-anchor="middle" font-size="10">who ran it, what tallies</text><text x="872" y="370.85" text-anchor="middle" font-size="10">can and cannot mean</text><rect x="24" y="400" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="140" y="420.85" text-anchor="middle" font-size="11" font-weight="700">Decisions log</text><text x="140" y="434.85" text-anchor="middle" font-size="10">D-01..31 recorded, O-1..9 open</text><text x="140" y="448.85" text-anchor="middle" font-size="10">owner's words pasted</text><rect x="268" y="400" width="476" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="506" y="420.85" text-anchor="middle" font-size="11" font-weight="700">Outside seats (drafts only, nothing sent)</text><text x="506" y="434.85" text-anchor="middle" font-size="10">right of reply: Day, critics · human geneticist + one reader per camp</text><text x="506" y="448.85" text-anchor="middle" font-size="10">non-Claude review packet · COI + licence</text><rect x="756" y="400" width="232" height="62" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-width="1.5"/><text x="872" y="420.85" text-anchor="middle" font-size="11" font-weight="700">Hostile reviews</text><text x="872" y="434.85" text-anchor="middle" font-size="10">one from each camp</text><text x="872" y="448.85" text-anchor="middle" font-size="10">(written by same model)</text><rect x="24" y="484" width="964" height="74" rx="8" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1.5"/><text x="506" y="510.85" text-anchor="middle" font-size="11" font-weight="700">Feedback loop: finding → one of three routes</text><text x="506" y="524.85" text-anchor="middle" font-size="10">1 no-decision fix: done at once · 2 proposal: written with the verdicts it would move, held</text><text x="506" y="538.85" text-anchor="middle" font-size="10">3 owner decision (DECISIONS.md) → rule-freeze: 24 h cooling-off, 3-review re-score, new rule revision</text><path d="M500,484 L500,466" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><path d="M24,520 L14,520 L14,270 L700,270 L700,246" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ahp)"/><text x="250" y="264" text-anchor="middle" font-size="9">rule revision re-enters here</text><text x="505" y="580" text-anchor="middle" font-size="10">Proposed R5 exit criterion (owner to confirm): no CRITICAL finding open, every MAJOR closed or accepted by the owner.</text><text x="505" y="600" text-anchor="middle" font-size="10" font-weight="700">Every pass so far was run by Claude inside the project; none is outside review. See METHODS-AND-LIMITATIONS.</text></svg>
