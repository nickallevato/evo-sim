<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 400" width="1010" height="400" font-family="DejaVu Sans, Verdana, sans-serif" fill="#6e7681" role="img" aria-label="evo-sim verdict logic: one quoted statement from tag to verdict or slip ledger, with proposed changes dashed"><title>evo-sim verdict logic: one quoted statement from tag to verdict or slip ledger, with proposed changes dashed</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eab308"/></marker></defs><rect x="20" y="160" width="110" height="56" rx="8" fill="#e8833a" fill-opacity="0.16" stroke="#e8833a" stroke-width="1.5"/><text x="75" y="177.85" text-anchor="middle" font-size="11" font-weight="700">Quoted</text><text x="75" y="191.85" text-anchor="middle" font-size="10">statement</text><text x="75" y="205.85" text-anchor="middle" font-size="10">(rule S scope)</text><rect x="160" y="160" width="130" height="56" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="225" y="177.85" text-anchor="middle" font-size="11" font-weight="700">Tag first</text><text x="225" y="191.85" text-anchor="middle" font-size="10">dialectic or</text><text x="225" y="205.85" text-anchor="middle" font-size="10">rhetoric (RH)</text><path d="M130,188 L160,188" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><rect x="160" y="50" width="130" height="50" rx="8" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 3"/><text x="225" y="71.85" text-anchor="middle" font-size="11" font-weight="700">(d) RH6 revision</text><text x="225" y="85.85" text-anchor="middle" font-size="10">proposed</text><path d="M225,100 L225,160" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ahp)"/><rect x="330" y="50" width="170" height="56" rx="8" fill="#e8833a" fill-opacity="0.16" stroke="#e8833a" stroke-width="1.5"/><text x="415" y="67.85" text-anchor="middle" font-size="11" font-weight="700">rhetoric</text><text x="415" y="81.85" text-anchor="middle" font-size="10">device, audience, function,</text><text x="415" y="95.85" text-anchor="middle" font-size="10">dialectical core → slips.md</text><path d="M290,175 L310,175 L310,78 L330,78" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><rect x="330" y="160" width="150" height="56" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="405" y="177.85" text-anchor="middle" font-size="11" font-weight="700">Readings (RD, C)</text><text x="405" y="191.85" text-anchor="middle" font-size="10">every plausible reading</text><text x="405" y="205.85" text-anchor="middle" font-size="10">field = most defensible</text><path d="M290,195 L330,195" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><text x="310" y="184" text-anchor="middle" font-size="9">dialectic</text><text x="415" y="130" text-anchor="middle" font-size="9">no verdict change</text><rect x="530" y="80" width="190" height="46" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="625" y="93.5" text-anchor="middle" font-size="10" font-weight="700">Internal</text><text x="625" y="106.5" text-anchor="middle" font-size="9">holds · arithmetic-error ·</text><text x="625" y="119.5" text-anchor="middle" font-size="9">non-sequitur · pending (N)</text><rect x="530" y="170" width="190" height="46" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="625" y="183.5" text-anchor="middle" font-size="10" font-weight="700">Fidelity</text><text x="625" y="196.5" text-anchor="middle" font-size="9">accurate · partial · misread ·</text><text x="625" y="209.5" text-anchor="middle" font-size="9">unverifiable (F, U)</text><rect x="530" y="260" width="190" height="46" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="625" y="273.5" text-anchor="middle" font-size="10" font-weight="700">External</text><text x="625" y="286.5" text-anchor="middle" font-size="9">supported · contested ·</text><text x="625" y="299.5" text-anchor="middle" font-size="9">contradicted · untestable</text><path d="M480,188 L505,188 L505,103 L530,103" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M480,188 L505,188 L505,193 L530,193" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M480,188 L505,188 L505,283 L530,283" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><rect x="530" y="130" width="190" height="22" rx="5" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 3"/><text x="625" y="144.5" text-anchor="middle" font-size="10">(a) status unexamined: no check run</text><rect x="530" y="310" width="190" height="22" rx="5" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 3"/><text x="625" y="324.5" text-anchor="middle" font-size="10">(b) external_basis: data/literature/model</text><rect x="530" y="336" width="190" height="22" rx="5" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 3"/><text x="625" y="350.5" text-anchor="middle" font-size="10">(c) contested split four ways</text><rect x="760" y="150" width="120" height="76" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.5"/><text x="820" y="172" text-anchor="middle" font-size="10" font-weight="700">R1 materiality</text><text x="820" y="185" text-anchor="middle" font-size="9">slip moves conclusion</text><text x="820" y="198" text-anchor="middle" font-size="9">or a downstream number</text><text x="820" y="211" text-anchor="middle" font-size="9">&gt;25%, or flips it?</text><path d="M720,103 L740,103 L740,188 L760,188" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M720,193 L740,193 L740,188 L760,188" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M720,283 L740,283 L740,188 L760,188" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><rect x="900" y="90" width="100" height="56" rx="8" fill="#e8833a" fill-opacity="0.16" stroke="#e8833a" stroke-width="1.5"/><text x="950" y="108.5" text-anchor="middle" font-size="10" font-weight="700">Yes</text><text x="950" y="121.5" text-anchor="middle" font-size="9">error verdict,</text><text x="950" y="134.5" text-anchor="middle" font-size="9">counted</text><rect x="900" y="230" width="100" height="56" rx="8" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-width="1.5"/><text x="950" y="248.5" text-anchor="middle" font-size="10" font-weight="700">No</text><text x="950" y="261.5" text-anchor="middle" font-size="9">slip ledger,</text><text x="950" y="274.5" text-anchor="middle" font-size="9">no verdict change</text><path d="M880,175 L890,175 L890,118 L900,118" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><path d="M880,200 L890,200 L890,258 L900,258" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ah)"/><text x="500" y="385" text-anchor="middle" font-size="10">Dashed amber = proposal only, held back (owner decisions O-6 rule-freeze). SC: corrected in the same source = ledger. R1c: no input-looseness rescue for steep outputs.</text></svg>
