<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 710 258' role='img' aria-label='Ancestral variation: some differences predate the split' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>Ancestral variation: some differences predate the split</title><circle cx='250' cy='60' r='11' fill='#f59e0b'/><circle cx='280' cy='60' r='11' fill='#3b82f6'/><circle cx='310' cy='60' r='11' fill='#22c55e'/><circle cx='340' cy='60' r='11' fill='#f59e0b'/><circle cx='370' cy='60' r='11' fill='#a3a3a3'/><circle cx='400' cy='60' r='11' fill='#3b82f6'/><circle cx='430' cy='60' r='11' fill='#22c55e'/><circle cx='460' cy='60' r='11' fill='#a3a3a3'/><text x='355' y='30' font-size='14' fill='#8b949e' text-anchor='middle' font-weight='normal'>the shared ancestors already differed from each other</text><path d='M300 78 L170 150 M410 78 L540 150' stroke='#8b949e' stroke-width='2.5' fill='none'/><circle cx='100' cy='170' r='11' fill='#f59e0b'/><circle cx='130' cy='170' r='11' fill='#f59e0b'/><circle cx='160' cy='170' r='11' fill='#22c55e'/><circle cx='190' cy='170' r='11' fill='#f59e0b'/><circle cx='220' cy='170' r='11' fill='#f59e0b'/><circle cx='490' cy='170' r='11' fill='#3b82f6'/><circle cx='520' cy='170' r='11' fill='#3b82f6'/><circle cx='550' cy='170' r='11' fill='#a3a3a3'/><circle cx='580' cy='170' r='11' fill='#3b82f6'/><circle cx='610' cy='170' r='11' fill='#3b82f6'/><text x='160' y='206' font-size='14' fill='#6e7681' text-anchor='middle' font-weight='normal'>family 1</text><text x='550' y='206' font-size='14' fill='#6e7681' text-anchor='middle' font-weight='normal'>family 2</text><text x='355' y='244' font-size='14' fill='#22c55e' text-anchor='middle' font-weight='bold'>some differences today were already there BEFORE the split, so not all of them are new</text></svg>