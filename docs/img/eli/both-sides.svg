<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 710 270' role='img' aria-label='Both sides got some things right and some things wrong' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>Both sides got some things right and some things wrong</title><rect x='20' y='20' width='320' height='232' rx='12' fill='none' stroke='#f59e0b' stroke-width='2.5'/><text x='180' y='50' font-size='17' fill='#f59e0b' text-anchor='middle' font-weight='bold'>“not enough time” side</text><text x='42' y='84' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='66' y='84' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>some formulas are exactly right</text><text x='42' y='112' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='66' y='112' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>bacteria rate is real</text><text x='42' y='140' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='66' y='140' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>old 1/300 sum adds up</text><text x='42' y='174' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='66' y='174' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>counted letters, not events</text><text x='42' y='202' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='66' y='202' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>misread a source</text><text x='42' y='230' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='66' y='230' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>assumed an empty start</text><rect x='370' y='20' width='320' height='232' rx='12' fill='none' stroke='#3b82f6' stroke-width='2.5'/><text x='530' y='50' font-size='17' fill='#3b82f6' text-anchor='middle' font-weight='bold'>“the math is wrong” side</text><text x='392' y='84' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='416' y='84' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>rate doesn’t shrink with size</text><text x='392' y='112' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='416' y='112' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>many changes at once</text><text x='392' y='140' font-size='17' fill='#22c55e' text-anchor='start' font-weight='bold'>✓</text><text x='416' y='140' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>old differences counted</text><text x='392' y='174' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='416' y='174' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>counted some things twice</text><text x='392' y='202' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='416' y='202' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>“soft selection” fix failed</text><text x='392' y='230' font-size='17' fill='#ef4444' text-anchor='start' font-weight='bold'>✗</text><text x='416' y='230' font-size='14' fill='#8b949e' text-anchor='start' font-weight='normal'>skipped some questions</text></svg>