<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 210' role='img' aria-label='Conveyor belt: a long ride time does not mean a slow finishing rate' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>Conveyor belt: a long ride time does not mean a slow finishing rate</title><defs><marker id='a' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#22c55e'/></marker></defs><rect x='40' y='120' width='620' height='14' rx='7' fill='#6e7681'/><circle cx='60' cy='127' r='16' fill='none' stroke='#6e7681' stroke-width='4'/><circle cx='640' cy='127' r='16' fill='none' stroke='#6e7681' stroke-width='4'/><rect x='70' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.45'/><rect x='126' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.51'/><rect x='182' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.56'/><rect x='238' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.61'/><rect x='294' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.67'/><rect x='350' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.73'/><rect x='406' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.78'/><rect x='462' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.83'/><rect x='518' y='84' width='34' height='34' rx='5' fill='#3b82f6' opacity='0.89'/><rect x='574' y='84' width='34' height='34' rx='5' fill='#22c55e' opacity='0.95'/><path d='M664 100 q30 0 34 40' fill='none' stroke='#22c55e' stroke-width='3' marker-end='url(#a)'/><path d='M70 66 H664' stroke='#8b949e' stroke-width='1.5' stroke-dasharray='4 4'/><text x='367' y='56' font-size='15' fill='#8b949e' text-anchor='middle' font-weight='normal'>each change takes a LONG time to ride all the way across</text><text x='367' y='168' font-size='15' fill='#22c55e' text-anchor='middle' font-weight='bold'>…but the belt is full, so one arrives at the end every step</text><text x='367' y='196' font-size='14' fill='#6e7681' text-anchor='middle' font-weight='normal'>time for ONE change  ≠  how often changes finish</text></svg>